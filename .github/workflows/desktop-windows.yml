name: SoloFlow Windows app

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-windows.yml'

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build SoloFlow.exe
        run: pnpm --filter @flowbooks/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: SoloFlow-exe
          path: apps/desktop/dist/SoloFlow.exe
          if-no-files-found: error
