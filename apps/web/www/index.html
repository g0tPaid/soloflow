<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoloFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #1a1a1a;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.5;
      }
      a {
        color: #e40046;
      }
    </style>
    <script>
      (function () {
        var target = 'https://soloflow.practicalthings.store/dashboard';
        var storageKey = 'soloflow-shell-retry';
        try {
          if (sessionStorage.getItem(storageKey) === '1') return;
          sessionStorage.setItem(storageKey, '1');
        } catch (error) {
          return;
        }
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>SoloFlow is offline</h1>
      <p>
        Connect once so this phone can open SoloFlow. After you sign in, dashboard and invoices
        open again without a connection.
      </p>
      <p><a href="https://soloflow.practicalthings.store/dashboard">Try again</a></p>
    </main>
  </body>
</html>
