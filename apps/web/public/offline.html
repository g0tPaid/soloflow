<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoloFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: sans-serif;
        background: #fff;
        color: #111;
      }
      main {
        max-width: 24rem;
        padding: 2rem;
        text-align: center;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        border-radius: 0.75rem;
        background: #e40046;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      a {
        color: #e40046;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">SF</div>
      <h1>SoloFlow is offline</h1>
      <p>Open SoloFlow once while you are online so this phone can save the app. After that, invoices you have already opened stay available.</p>
      <p><a href="/dashboard">Try again</a></p>
    </main>
  </body>
</html>
