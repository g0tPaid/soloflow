<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoloFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: sans-serif;
        background: #fff;
        color: #111;
      }
      main {
        max-width: 24rem;
        padding: 2rem;
        text-align: center;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        border-radius: 0.75rem;
        background: #e40046;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      a {
        color: #e40046;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">SF</div>
      <h1>This page is not on this phone yet</h1>
      <p>SoloFlow can open pages you have already used while online. Dashboard and invoices are saved after one signed-in visit.</p>
      <p><a href="/dashboard">Open dashboard</a></p>
    </main>
  </body>
</html>
